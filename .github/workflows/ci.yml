name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Unit and smoke tests need no display and no Tcl/Tk: the GUI tests use test/fake/tk.rb.
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4']
        exclude:
          # setup-ruby has no Ruby 3.0 build for Apple Silicon runners
          - os: macos-latest
            ruby: '3.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: The gem builds
        run: bundle exec rake build

  # Style check. Not blocking until the code base has been checked clean once (run `rake rubocop` locally).
  rubocop:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake rubocop

  # The real thing: --selftest drives the actual windows with real Tk under a virtual display.
  # Not blocking: Tk on a headless runner is the likeliest part of the matrix to misbehave.
  selftest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl/Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y tcl-dev tk-dev xvfb
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install tk
      - run: xvfb-run -a ruby bin/rubytalk --selftest
